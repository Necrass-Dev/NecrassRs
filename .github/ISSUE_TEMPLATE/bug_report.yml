name: Bug report
description: Report behavior that does not match the documented contracts or current behavior.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use this template for behavior that is implemented but incorrect.
        For missing behavior, use the feature or task template.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the incorrect behavior in one or two paragraphs.
      placeholder: The server invokes a resolver even though its required argument is missing.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest command, input, or test case that reproduces the bug.
      placeholder: |
        1. Run `cargo test --workspace --locked`
        2. Use this schema/query input:
           ```text
           ...
           ```
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: State what should happen and cite the relevant contract or design document when possible.
      placeholder: The request should be rejected before resolver execution.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exact error, panic, GraphQL response, or test failure when available.
      render: text
    validations:
      required: true

  - type: textarea
    id: affected_area
    attributes:
      label: Affected area
      description: Name the crate, command, API contract, or design section involved.
      placeholder: SDL generation, resolver execution, Axum integration, docs/architecture.md
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Provide versions that can affect the result.
      value: |
        - OS:
        - Rust:
        - Cargo:
        - NecrassRs and relevant dependency versions:
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for the same report.
          required: true
        - label: I checked the relevant design or behavior document when one exists.
          required: true
