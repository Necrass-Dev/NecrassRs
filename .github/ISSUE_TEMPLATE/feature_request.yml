name: Feature or task
description: Propose or track a scoped change to NecrassRs.
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Use this template for new behavior, planned implementation work, and
        documentation changes that should be tracked before opening a pull
        request. Use the tracking template for milestones spanning multiple sub-issues.

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: State the concrete result this issue should deliver.
      placeholder: Generate resolver contracts from SDL during the consumer Cargo build.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation or use case
      description: Explain the workflow, bug prevention, learning goal, or project need behind the change.
      placeholder: This keeps SDL as the public API contract while preserving user-written resolver code.
    validations:
      required: true

  - type: textarea
    id: expected_outcome
    attributes:
      label: Expected outcome
      description: Describe the behavior, API, command, documentation, or internal contract that should exist when this is done.
      placeholder: |
        `cargo build` regenerates Rust contracts in `OUT_DIR` without modifying user source.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: List the crates, commands, docs, or tests expected to change. Use "unknown" if this issue still needs design.
      placeholder: |
        - `necrassrs-build`
        - Generated consumer code
        - Build checks for valid and invalid SDL
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: Related design and behavior documents
      description: Link the relevant files and note whether they already define the change.
      placeholder: |
        - `docs/architecture.md`: defines crate boundaries and code ownership.
        - Related issue: defines the expected consumer behavior.
    validations:
      required: true

  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries and non-goals
      description: List behavior that should stay out of this issue.
      placeholder: This issue does not add database integration or another HTTP adapter.
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Use concrete, testable statements when the scope is known.
      placeholder: |
        - Invalid SDL fails the build with a source diagnostic.
        - Generated contracts compile with user implementations.
        - `cargo test --workspace --locked` passes.
    validations:
      required: false

  - type: textarea
    id: branch
    attributes:
      label: Branch
      description: Name the branch that should carry this work, if known.
      placeholder: issue-123-sdl-build-integration
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for the same request or task.
          required: true
        - label: I checked the relevant design or behavior document when one exists.
          required: true
