name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 2.0.0 (without v)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Prepare and publish release
    if: ${{ github.repository_owner == 'Necrass-Dev' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy

      - name: Install repository tools
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3

      - name: Fetch workspace dependencies
        run: cargo fetch --locked

      - name: Prepare release or resume existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release-ci.sh prepare "$RELEASE_VERSION"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked

      - name: Verify release packages
        run: .github/scripts/release.sh verify "$RELEASE_VERSION"

      - name: Commit and tag validated release
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          bash .github/scripts/release-ci.sh tag "$RELEASE_VERSION"

      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish release
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/release.sh publish "$RELEASE_VERSION"
