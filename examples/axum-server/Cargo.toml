[package]
name = "axum-server"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "axum-server"
path = "src/main.rs"
doc = false

[dependencies]
axum = "0.8.9"
necrassrs.workspace = true
necrassrs-axum.workspace = true
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread"] }

[build-dependencies]
necrassrs-build.workspace = true

[dev-dependencies]
serde_json = "1.0"
tower = { version = "0.5", features = ["util"] }
