[workspace]
members = [
    "crates/reed-compiler",
    "crates/reed-parser",
    "crates/necrassrs",
    "crates/necrassrs-actix",
    "crates/necrassrs-axum",
    "crates/necrassrs-build",
    "crates/necrassrs-cli",
    "crates/necrassrs-http",
    "examples/axum-server",
    "examples/actix-server",
    "examples/tutorial"
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
reed-compiler = { path = "crates/reed-compiler", version = "0.1.0" }
reed-parser = { path = "crates/reed-parser", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
