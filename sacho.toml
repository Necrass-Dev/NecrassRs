[changelog]
path = "CHANGELOG.md"
title = "Changelog"
unreleased-heading = "To be released."
materialize = true
region-detection = "heading"

[fragments]
directory = "changes.d"
next-file = "next"

[links]
"#" = "https://github.com/Necrass-Dev/NecrassRs/issues/{n}"

[vcs]
preset = "git"

[check]
paths = [
    "Cargo.toml",
    "crates/**/Cargo.toml",
    "crates/**/src/**",
    "crates/necrassrs-cli/templates/**",
]
