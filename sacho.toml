[changelog]
path = "CHANGELOG.md"
title = "Changelog"
unreleased-heading = "To be released."
materialize = true
region-detection = "heading"

[fragments]
directory = "changes.d"
next-file = "next"

[links]
"#" = "https://github.com/Necrass-Dev/NecrassRs/issues/{n}"

[vcs]
preset = "git"

[check]
paths = []

[[sections]]
id = "necrassrs"
directory = "necrassrs"

[[sections]]
id = "necrassrs-build"
directory = "necrassrs-build"

[[sections]]
id = "necrassrs-http"
directory = "necrassrs-http"

[[sections]]
id = "necrassrs-axum"
directory = "necrassrs-axum"

[[sections]]
id = "necrassrs-actix"
directory = "necrassrs-actix"

[[sections]]
id = "necrassrs-cli"
directory = "necrassrs-cli"

[[sections]]
id = "reed-compiler"
directory = "reed-compiler"

[[sections]]
id = "reed-parser"
directory = "reed-parser"
