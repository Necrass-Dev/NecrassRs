[package]
name = "necrassrs-actix"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/necrassrs-actix"
description = "Actix Web integration for NecrassRs GraphQL servers."
readme = "README.md"
keywords = ["graphql", "actix", "server", "web"]
categories = ["web-programming::http-server"]

[dependencies]
actix-web = "4"
necrassrs.workspace = true
necrassrs-http.workspace = true
serde.workspace = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "sync"] }
tower = { version = "0.5", features = ["util"] }
serde_json = "1.0"
