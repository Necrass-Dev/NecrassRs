[package]
name = "{{name}}"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
necrassrs = { git = "https://github.com/Necrass-Dev/NecrassRs.git", rev = "cc3a3b2a77f42b91d3fe417c48e346682f26dc7c", version = "0.1.0" }
necrassrs-axum = { git = "https://github.com/Necrass-Dev/NecrassRs.git", rev = "cc3a3b2a77f42b91d3fe417c48e346682f26dc7c", version = "0.1.0" }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread"] }

[build-dependencies]
miette = "7.6.0"
necrassrs-build = { git = "https://github.com/Necrass-Dev/NecrassRs.git", rev = "cc3a3b2a77f42b91d3fe417c48e346682f26dc7c", version = "0.1.0" }

[patch.crates-io]
apollo-compiler = { git = "https://github.com/Necrass-Dev/NecrassRs.git", rev = "cc3a3b2a77f42b91d3fe417c48e346682f26dc7c", version = "1.33.0" }

[workspace]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
