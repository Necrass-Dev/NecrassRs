[package]
name = "{{name}}"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
necrassrs = "0.1.0"
necrassrs-axum = "0.1.0"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread"] }

[build-dependencies]
miette = "7.6.0"
necrassrs-build = "0.1.0"

[workspace]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
