[package]
name = "necrassrs-cli"
version.workspace = true
edition.workspace = true

[dependencies]
clap = { version = "4.6", features = ["derive"] }
dialoguer = { version = "0.12", default-features = false }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[[bin]]
name = "necrass"
path = "src/main.rs"
doc = false
