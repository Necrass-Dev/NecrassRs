[package]
name = "necrassrs-build"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/necrassrs-build"
description = "Build-time GraphQL validation and Rust code generation for NecrassRs."
readme = "README.md"
keywords = ["graphql", "codegen", "build", "sdl"]
categories = ["development-tools::build-utils", "web-programming"]

[dependencies]
reed-compiler.workspace = true
miette = "7.6.0"
quote = "1.0"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
syn = { version = "2.0", features = ["full", "visit", "visit-mut"] }

[dev-dependencies]
futures = "0.3"
serde_json = "1.0"
