[package]
name = "reed-parser"
version.workspace = true
authors = ["Irina Shestak <shestak.irina@gmail.com>"]
license = "MIT OR Apache-2.0"
repository.workspace = true
documentation = "https://docs.rs/reed-parser"
description = "A parser for the GraphQL language."
keywords = ["graphql", "parser", "graphql-tooling"]
categories = [
    "compilers",
    "development-tools",
    "parser-implementations",
    "parsing",
    "web-programming",
]
edition.workspace = true
readme = "README.md"

[lints.clippy]
# Preserve the upstream control-flow structure after adopting the workspace edition.
collapsible_if = "allow"

[lib]
name = "reed_parser"

[dependencies]
memchr = "2.6.1"
rowan = "0.16.0"
thiserror = "2.0.0"

[dev-dependencies]
expect-test = "1.4"
indexmap = "2.0.0"
