[package]
name = "necrassrs-axum"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/necrassrs-axum"
description = "Axum integration for NecrassRs GraphQL servers."
readme = "README.md"
keywords = ["graphql", "axum", "server", "web"]
categories = ["web-programming::http-server"]

[dependencies]
axum = "0.8.9"
necrassrs.workspace = true
necrassrs-http.workspace = true
serde.workspace = true
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
