<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GraphiQL</title>
  <style>html, body, #graphiql { height: 100%; margin: 0; }</style>
  <link rel="stylesheet" href="https://esm.sh/graphiql@5.4.0/dist/style.css" integrity="sha384-TFpQQKp325U5sd3PddH4cS0KOB3Gz/aqdEe12Mqkkq3wm2MGcDhRX5WhWf+o8akh" crossorigin="anonymous">
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.3.0",
        "react/": "https://esm.sh/react@19.3.0/",
        "react-dom": "https://esm.sh/react-dom@19.3.0",
        "react-dom/": "https://esm.sh/react-dom@19.3.0/",
        "graphiql": "https://esm.sh/graphiql@5.4.0?standalone&external=react,react-dom,@graphiql/react,graphql",
        "graphiql/": "https://esm.sh/graphiql@5.4.0/",
        "@graphiql/react": "https://esm.sh/@graphiql/react@0.39.0?standalone&external=react,react-dom,graphql,@graphiql/toolkit,@emotion/is-prop-valid",
        "@graphiql/toolkit": "https://esm.sh/@graphiql/toolkit@0.12.1?standalone&external=graphql",
        "graphql": "https://esm.sh/graphql@17.0.2",
        "@emotion/is-prop-valid": "data:text/javascript,"
      }
    }
  </script>
  <script type="module">
    import React from 'react';
    import { createRoot } from 'react-dom/client';
    import { GraphiQL } from 'graphiql';
    import { createGraphiQLFetcher } from '@graphiql/toolkit';
    import 'graphiql/setup-workers/esm.sh';

    const element = document.getElementById('graphiql');
    const fetcher = createGraphiQLFetcher({ url: element.dataset.endpoint });
    createRoot(element).render(React.createElement(GraphiQL, { fetcher }));
  </script>
</head>
<body>
  <div id="graphiql" data-endpoint="__NECRASSRS_ENDPOINT__"></div>
</body>
</html>
