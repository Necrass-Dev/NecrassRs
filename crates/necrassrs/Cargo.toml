[package]
name = "necrassrs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/necrassrs"
description = "SDL-first GraphQL execution and resolver contracts for Rust."
readme = "README.md"
keywords = ["graphql", "server", "execution", "sdl"]
categories = ["web-programming"]

[dependencies]
reed-compiler.workspace = true
futures-util = "0.3"
serde.workspace = true

[dev-dependencies]
async-graphql = { version = "=7.2.1", default-features = false }
criterion = "0.7.0"
futures = "0.3"
opentelemetry = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["testing"] }
serde_json = "1.0"
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.32", default-features = false }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }

[[bench]]
name = "query_execution"
path = "benches/query_execution/main.rs"
harness = false
